name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (gcc)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade pip meson ninja

      - name: Configure
        run: meson setup build --wrap-mode=forcefallback

      - name: Build
        run: meson compile -C build

      - name: Test
        run: meson test -C build --suite minscan --print-errorlogs

  sanitizers:
    name: Linux (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade pip meson ninja

      - name: Configure
        run: meson setup build -Db_sanitize=address,undefined -Dbuildtype=debug --wrap-mode=forcefallback

      - name: Build
        run: meson compile -C build

      - name: Test
        run: meson test -C build --suite minscan --print-errorlogs

  windows-cross:
    name: Windows (mingw cross build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
          python -m pip install --upgrade pip meson ninja

      - name: Configure
        run: >-
          meson setup --cross-file cross/mingw.ini build-win
          -Dbuild_cli=true -Dbuild_tests=false

      - name: Build
        run: meson compile -C build-win

      - name: Verify artifacts
        run: |
          test -f build-win/minscan.exe
          test -f build-win/libminscan.dll
          x86_64-w64-mingw32-objdump -p build-win/minscan.exe | grep -q SETUPAPI.dll
          x86_64-w64-mingw32-nm build-win/libminscan.dll | grep -q " T ms_open"

  wheel:
    name: Python wheel smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install and import
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/python -c "import minscan; print(minscan.__version__)"

      - name: Binding tests
        run: |
          /tmp/wheel-venv/bin/pip install pytest
          /tmp/wheel-venv/bin/python -m pytest python/tests -q
